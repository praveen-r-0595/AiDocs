<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js/styles/atom-one-dark.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <button class="btn btn-primary" id="openBtn" title="Open File">📂 Open</button>
                <button class="btn btn-primary" id="browseBtn" title="Browse Folder">📁 Browse</button>
            </div>
            <div class="header-center">
                <input type="text" id="pathInput" class="path-input" readonly placeholder="No file opened">
            </div>
            <div class="header-right">
                <button class="btn btn-theme" id="themeBtn" title="Toggle Dark/Light Mode">🌙</button>
                <button class="btn btn-debug" id="debugToggle" title="Toggle Debug Console">🐛</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main">
            <!-- Sidebar - File List -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <h3>Files</h3>
                </div>
                <div class="file-list" id="fileList">
                    <div class="empty-state">No files</div>
                </div>
            </div>

            <!-- Editor/Viewer -->
            <div class="editor">
                <div class="markdown-content" id="content">
                    <div class="empty-state">
                        <h2>Welcome to Markdown Viewer</h2>
                        <p>📂 Open a file or browse a folder to get started</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="statusbar">
            <span id="status">Ready</span>
        </div>

        <!-- Debug Console Panel -->
        <div class="debug-panel hidden" id="debugPanel">
            <div class="debug-header">
                <h3>Debug Console</h3>
                <button class="btn btn-small" id="debugClear">Clear</button>
            </div>
            <div class="debug-console" id="debugConsole"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
